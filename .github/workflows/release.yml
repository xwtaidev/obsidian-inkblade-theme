name: Release Obsidian theme

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(jq -r .version manifest.json)"
          echo "tag=$tag manifest.version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match manifest.json version $version"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" manifest.json theme.css --clobber
          else
            gh release create "$tag" \
              --title="Inkblade $tag" \
              --generate-notes \
              manifest.json theme.css
          fi
